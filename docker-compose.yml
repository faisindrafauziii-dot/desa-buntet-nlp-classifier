version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: buntet_user
      POSTGRES_PASSWORD: buntet_password
      POSTGRES_DB: desa_buntet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - buntet_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - buntet_network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - buntet_network
    volumes:
      - ./ml-service:/app
      - ml_models:/app/models

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://buntet_user:buntet_password@postgres:5432/desa_buntet
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - ml-service
    networks:
      - buntet_network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - buntet_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  ml_models:

networks:
  buntet_network:
    driver: bridge
